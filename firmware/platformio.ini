[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32.git
board = seeed_xiao_esp32s3
framework = arduino
board_build.f_cpu = 80000000L
monitor_speed = 115200

upload_protocol = esptool
debug_tool = esp-builtin

lib_deps =
    fastled/FastLED @ ^3.9.0
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF

build_unflags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; CDC_ON_BOOT must be 0: with it enabled the core calls USB.begin() before setup(),
; which freezes the descriptor and silently ignores our VID/PID/product overrides.
; TPB_* names avoid colliding with USB_VID/USB_PID defined in the board's pins_arduino.h.
build_flags = 
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D USB_MANUFACTURER="\"Simulation-Laboratories\""
    -D USB_PRODUCT="\"Teams Presence Bridge\""
    -D TPB_USB_VID=0x1209
    -D TPB_USB_PID=0x0005

