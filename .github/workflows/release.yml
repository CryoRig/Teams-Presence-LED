name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify tag matches Cargo.toml and firmware version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compare versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG_VER="${TAG#v}"
          BRIDGE_VER=$(grep -m1 '^version' bridge/teams-presence-bridge-rs/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          FW_MAJOR=$(grep -m1 '#define FW_VERSION_MAJOR' firmware/src/main.cpp | awk '{print $3}')
          FW_MINOR=$(grep -m1 '#define FW_VERSION_MINOR' firmware/src/main.cpp | awk '{print $3}')
          FW_PATCH=$(grep -m1 '#define FW_VERSION_PATCH' firmware/src/main.cpp | awk '{print $3}')
          FW_VER="$FW_MAJOR.$FW_MINOR.$FW_PATCH"
          echo "tag=$TAG_VER bridge=$BRIDGE_VER firmware=$FW_VER"
          FAIL=0
          if [ "$TAG_VER" != "$BRIDGE_VER" ]; then
            echo "::error::Release tag $TAG does not match bridge version $BRIDGE_VER in Cargo.toml"
            FAIL=1
          fi
          if [ "$TAG_VER" != "$FW_VER" ]; then
            echo "::error::Release tag $TAG does not match firmware version $FW_VER in firmware/src/main.cpp"
            FAIL=1
          fi
          exit $FAIL

  build-bridge:
    name: Build Bridge (Windows)
    needs: verify-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge/teams-presence-bridge-rs

      - name: Build bridge app
        working-directory: bridge/teams-presence-bridge-rs
        run: cargo build --release --locked

      - name: Upload bridge exe to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} bridge\teams-presence-bridge-rs\target\release\TeamsPresenceBridge.exe

  build-firmware:
    name: Build Firmware
    needs: verify-version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/platformio-requirements.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', '.github/workflows/platformio-requirements.txt') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install -r .github/workflows/platformio-requirements.txt

      - name: Build firmware
        working-directory: firmware
        run: pio run

      - name: Prepare firmware artifacts
        working-directory: firmware
        run: |
          cp .pio/build/seeed_xiao_esp32s3/firmware.bin seeed_xiao_esp32s3.bin

      # manifest.json lets the bridge compare bridge and firmware versions independently.
      - name: Generate manifest.json
        working-directory: firmware
        run: |
          BRIDGE_VER=$(grep -m1 '^version' ../bridge/teams-presence-bridge-rs/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          FW_MAJOR=$(grep -m1 '#define FW_VERSION_MAJOR' src/main.cpp | awk '{print $3}')
          FW_MINOR=$(grep -m1 '#define FW_VERSION_MINOR' src/main.cpp | awk '{print $3}')
          FW_PATCH=$(grep -m1 '#define FW_VERSION_PATCH' src/main.cpp | awk '{print $3}')
          printf '{\n  "bridge": "%s",\n  "firmware": "%s.%s.%s"\n}\n' "$BRIDGE_VER" "$FW_MAJOR" "$FW_MINOR" "$FW_PATCH" > manifest.json
          cat manifest.json

      - name: Upload firmware files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} firmware/seeed_xiao_esp32s3.bin firmware/manifest.json

  # Hash every uploaded asset into one SHA256SUMS.txt. The bridge updater requires it
  # (refuses unverified firmware); the .txt suffix keeps it openable on Windows.
  checksums:
    name: Publish SHA256SUMS.txt
    needs: [build-bridge, build-firmware]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download ${{ github.event.release.tag_name }} --repo ${{ github.repository }} --dir assets

      - name: Generate SHA256SUMS.txt
        working-directory: assets
        run: |
          rm -f SHA256SUMS SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} assets/SHA256SUMS.txt --repo ${{ github.repository }} --clobber
