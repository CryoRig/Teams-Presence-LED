[env:seeed_xiao_esp32s3]
platform = espressif32 @ 7.1.3
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter = +<main.cpp> +<UsbManager.cpp> -<serial.cpp>
board_build.f_cpu = 80000000L
monitor_speed = 115200

upload_protocol = esptool
debug_tool = esp-builtin

lib_deps =
    fastled/FastLED @ 3.10.5
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF

build_unflags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; CDC_ON_BOOT must be 0: with it enabled the core calls USB.begin() before setup(),
; which freezes the descriptor and silently ignores our VID/PID/product overrides.
; TPB_* names avoid colliding with USB_VID/USB_PID defined in the board's pins_arduino.h.
build_flags = 
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D USB_MANUFACTURER="\"Simulation-Laboratories\""
    -D USB_PRODUCT="\"Teams Presence Bridge\""
    -D TPB_USB_VID=0x1209
    -D TPB_USB_PID=0x0005

[serial_common]
framework = arduino
lib_deps = fastled/FastLED @ 3.10.5
build_src_filter = +<serial.cpp> -<main.cpp> -<UsbManager.cpp>
monitor_speed = 115200

[env:esp01_1m]
extends = serial_common
platform = espressif8266
board = esp01_1m
build_flags = -D LED_PIN=2

[env:xiao_rp2040]
extends = serial_common
platform = raspberrypi
board = seeed_xiao_rp2040
build_flags = -D LED_PIN=2

[env:demo_f030f4]
extends = serial_common
platform = ststm32
board = demo_f030f4
lib_deps = adafruit/Adafruit NeoPixel @ 1.12.5
build_flags = -D LED_PIN=PA7 -D USE_NEOPIXEL

[env:nano_atmega168]
extends = serial_common
platform = atmelavr
board = nanoatmega168
build_flags = -D LED_PIN=2

[env:uno_atmega328]
extends = serial_common
platform = atmelavr
board = uno
build_flags = -D LED_PIN=2

[env:pro_mini_atmega328]
extends = serial_common
platform = atmelavr
board = pro16MHzatmega328
build_flags = -D LED_PIN=2

[env:nano_atmega328]
extends = serial_common
platform = atmelavr
board = nanoatmega328
build_flags = -D LED_PIN=2

[env:pro_micro_atmega32u4]
extends = serial_common
platform = atmelavr
board = sparkfun_promicro16
build_flags = -D LED_PIN=2

[env:luatos_esp32c3]
extends = serial_common
platform = espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags = -D LED_PIN=4 -D ARDUINO_USB_MODE=0 -D ARDUINO_USB_CDC_ON_BOOT=0

[env:rpi_pico]
extends = serial_common
platform = raspberrypi
board = rpipico
build_flags = -D LED_PIN=2
