[package]
name = "teams-presence-bridge-rs"
version = "0.7.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Sim-Lab"]
license = "MIT"
repository = "https://github.com/CryoRig/Teams-Presence-LED"
description = "Windows tray app that mirrors your Microsoft Teams presence to a USB HID LED indicator"
default-run = "TeamsPresenceBridge"

[[bin]]
name = "TeamsPresenceBridge"
path = "src/main.rs"

[dependencies]
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
eframe = "0.37"
tray-icon = "0.26.1"
winreg = "0.56.0"
ureq = { version = "3.5.0", features = ["json", "platform-verifier", "rustls"], default-features = false }
espflash = { version = "4.7.0", default-features = false, features = ["serialport"] }
serialport = "4.10.1"
semver = "1.0.28"
sysinfo = "0.40.1"
tempfile = "3.27.0"
sha2 = "0.11.1"

[profile.release]
opt-level = "z"  # Optimize for size
lto = true       # Enable Link Time Optimization
strip = true     # Strip symbols from binary
codegen-units = 1 # Better optimization
# panic = "unwind" (default) is required so a panicking bridge thread can be caught and restarted (see main.rs)
