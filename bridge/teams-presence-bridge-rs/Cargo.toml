[package]
name = "teams-presence-bridge-rs"
version = "0.6.2"
edition = "2024"
rust-version = "1.97.1"
authors = ["Sim-Lab"]
license = "MIT"
repository = "https://github.com/CryoRig/Teams-Presence-LED"
description = "Windows tray app that mirrors your Microsoft Teams presence to a USB HID LED indicator"
default-run = "TeamsPresenceBridge"

[[bin]]
name = "TeamsPresenceBridge"
path = "src/main.rs"

[dependencies]
hidapi = "2.6.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.35"
tray-icon = "0.24"
winreg = "0.56.0"
ureq = { version = "3", features = ["json", "platform-verifier", "rustls"], default-features = false }
espflash = { version = "4", default-features = false, features = ["serialport"] }
serialport = "4"
semver = "1.0"
sysinfo = "0.39"
tempfile = "3"
sha2 = "0.10"

[profile.release]
opt-level = "z"  # Optimize for size
lto = true       # Enable Link Time Optimization
strip = true     # Strip symbols from binary
codegen-units = 1 # Better optimization
# panic = "unwind" (default) is required so a panicking bridge thread can be caught and restarted (see main.rs)
